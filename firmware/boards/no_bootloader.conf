# PitchComm no-MCUboot fallback config.
#
# Pass together with boards/no_bootloader.overlay and
# -DSB_CONFIG_BOOTLOADER_MCUBOOT=n; the exact command is in dev/build.md.
#
# A normal build gets CONFIG_USE_DT_CODE_PARTITION=y through
# CONFIG_BOOTLOADER_MCUBOOT (select USE_DT_CODE_PARTITION if
# !MCUBOOT_BOOTLOADER_MODE_RAM_LOAD, modules/Kconfig.mcuboot in NCS v3.4.0).
# With MCUboot off nothing selects it, and with the board's
# zephyr,mapped-partition nodes the linker then has no code-partition region
# at all (CONFIG_FLASH_USES_MAPPED_PARTITION stays off, so
# FLASH_LOAD_OFFSET/FLASH_LOAD_SIZE do not exist): the image would link from
# 0x0 over the full 1524 KB RRAM and overlap its own LittleFS and settings
# partitions. Keep this line.
#
# VERIFY(no-bootloader): required by source inspection; not yet exercised by a
# build. Confirm CONFIG_USE_DT_CODE_PARTITION=y and
# CONFIG_FLASH_USES_MAPPED_PARTITION=y in .config.
CONFIG_USE_DT_CODE_PARTITION=y
