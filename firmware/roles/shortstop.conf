# PitchComm shortstop: OLED call strip, one recall button, battery gauge,
# Thread sleepy end device, no audio.
#
# Build:
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp firmware -d firmware/build/shortstop -- \
#     -DEXTRA_CONF_FILE="roles/shortstop.conf;roles/field-common.conf"

CONFIG_PITCHCOMM_ROLE_SHORTSTOP=y
CONFIG_PITCHCOMM_CONSOLE=y
CONFIG_PITCHCOMM_DISPLAY=y
CONFIG_PITCHCOMM_FIELD_BUTTON=y
CONFIG_PITCHCOMM_BATTERY=y
CONFIG_PITCHCOMM_AUDIO=n

# In-tree display driver for the 128x32 SSD1306 on i2c22 (boards/ overlay).
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
