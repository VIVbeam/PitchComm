# PitchComm pitcher: smallest pod. One recall button, battery gauge, LE Audio
# to one earbud, Thread sleepy end device, no display.
#
# Build (roles/audio-unit.conf is owned by the LE Audio agent and must be
# passed too; conf files cannot include each other):
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp firmware -d firmware/build/pitcher -- \
#     -DEXTRA_CONF_FILE="roles/pitcher.conf;roles/field-common.conf;roles/audio-unit.conf"

CONFIG_PITCHCOMM_ROLE_PITCHER=y
CONFIG_PITCHCOMM_CONSOLE=y
CONFIG_PITCHCOMM_AUDIO=y
CONFIG_PITCHCOMM_FIELD_BUTTON=y
CONFIG_PITCHCOMM_BATTERY=y
CONFIG_PITCHCOMM_DISPLAY=n
