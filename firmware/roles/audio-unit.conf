# PitchComm LE Audio unit Kconfig fragment.
#
# Included by the pitcher and audio-proof builds on top of the generated unit
# conf (or roles/audio-proof.conf). It adds the Bluetooth LE Audio unicast-client
# stack (source role), the LC3 codec and the LittleFS audio storage. It
# deliberately contains no Thread / 802.15.4 options; roles/field-common.conf
# owns those.
#
# Target: xiao_nrf54l15/nrf54l15/cpuapp, NCS v3.4.0.

# --- Bluetooth host ---------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_ISO_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_UTF8=y

# --- BAP unicast client (one sink ASE, mono) --------------------------------
CONFIG_BT_AUDIO=y
CONFIG_BT_AUDIO_TX=y
CONFIG_BT_BAP_UNICAST_CLIENT=y
CONFIG_BT_ISO_TX_BUF_COUNT=4
CONFIG_BT_ISO_MAX_CHAN=1
CONFIG_BT_BAP_UNICAST_CLIENT_GROUP_STREAM_COUNT=1
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SNK_COUNT=1
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SRC_COUNT=0

# --- Bonding ----------------------------------------------------------------
# The bond is kept in ZMS so pc_audio_reconnect()/the saved-address fallback
# can find the earbud again after a reboot.
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
# VERIFY: CONFIG_SETTINGS_ZMS depends on CONFIG_ZMS (subsys/settings/Kconfig,
# NCS v3.4.0).  Without CONFIG_ZMS the ZMS backend is silently not selected,
# so CONFIG_ZMS=y is required in addition to the requested CONFIG_SETTINGS_ZMS=y.
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# --- LC3 --------------------------------------------------------------------
CONFIG_LIBLC3=y
CONFIG_FPU=y

# --- Host buffer sizes ------------------------------------------------------
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_RX_STACK_SIZE=4096

# --- LittleFS clip storage --------------------------------------------------
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# nRF54L15 uses Nordic's SoftDevice Controller.  It defaults to y for
# SOC_SERIES_NRF54L in NCS (nrf/subsys/bluetooth/controller/Kconfig, verified
# in sdk-nrf v3.4.0); set explicitly so the intent is not lost.
CONFIG_BT_LL_SOFTDEVICE=y
