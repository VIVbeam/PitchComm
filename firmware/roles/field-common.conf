# PitchComm field-unit network: Thread plus shared storage. The generated unit
# conf (firmware/build/unit-confs/<key>.conf) selects the Thread device type:
# a sleepy end device, or a relay built as a Full Thread Device.
#
# Pass this fragment after the generated unit conf; conf files cannot include
# each other, so the build script must list it:
#   -DEXTRA_CONF_FILE="build/unit-confs/<key>.conf;roles/field-common.conf[;roles/audio-unit.conf]"

CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# VERIFY(kconfig): CONFIG_NET_SOCKETS_POSIX_NAMES does not exist in NCS v3.4.0
# (removed from subsys/net/lib/sockets/Kconfig); the firmware calls zsock_*
# directly, so no POSIX-name option is required here.
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_RADIO_WORKQUEUE_STACK_SIZE=1024
CONFIG_OPENTHREAD_NUM_MESSAGE_BUFFERS=48

# Settings storage for the saved volume and the Thread dataset. SETTINGS_ZMS
# depends on ZMS and FLASH_MAP; the ZMS backend falls back to the board's
# storage_partition when no zephyr,settings-partition chosen node exists.
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS_ZMS=y

CONFIG_PITCHCOMM_BATTERY=y
# board::Battery uses the nRF SAADC channel 7 (AIN7).
CONFIG_ADC=y
