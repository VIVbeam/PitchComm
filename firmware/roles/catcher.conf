# PitchComm catcher: first baseman's pod. OLED catcher menu, five buttons,
# battery gauge, LE Audio to one earbud, Thread sleepy end device.
#
# Build (roles/audio-unit.conf is owned by the LE Audio agent and must be
# passed too; conf files cannot include each other):
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp firmware -d firmware/build/catcher -- \
#     -DEXTRA_CONF_FILE="roles/catcher.conf;roles/field-common.conf;roles/audio-unit.conf"

CONFIG_PITCHCOMM_ROLE_CATCHER=y
CONFIG_PITCHCOMM_CONSOLE=y
CONFIG_PITCHCOMM_AUDIO=y
CONFIG_PITCHCOMM_DISPLAY=y
CONFIG_PITCHCOMM_CATCHER_MENU=y
CONFIG_PITCHCOMM_BATTERY=y

# In-tree display driver for the 128x32 SSD1306 on i2c22 (boards/ overlay).
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
