# Minimum-size overlay for the 712 KB MCUboot application slot.
#
# Apply last, after the generated unit conf
# (firmware/build/unit-confs/<key>.conf) and the audio fragments:
#   west build ... -- -DEXTRA_CONF_FILE="build/unit-confs/pitcher.conf;roles/field-common.conf;roles/audio-unit.conf;roles/min-size.conf"
# or tools\build_firmware.ps1 -MinSize.
#
# This drops diagnostics only. It does not change behavior: calls, audio, the
# console command set (minus logs), and persistence all stay.
#
# If the image still does not fit, the fallback is to build without MCUboot
# and give the application the boot area plus slot0; see firmware/README.md
# "No-MCUboot fallback (VERIFY)" and firmware/boards/no_bootloader.*.

CONFIG_LOG=n
CONFIG_ASSERT=n

# OpenThread: keep the buffers needed for a five-node star, drop debug.
CONFIG_OPENTHREAD_DEBUG=n
CONFIG_OPENTHREAD_NUM_MESSAGE_BUFFERS=32
CONFIG_OPENTHREAD_MAX_CHILDREN=4
