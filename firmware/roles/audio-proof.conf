# PitchComm LE Audio bench proof: audio storage + one earbud, no Thread and no
# call engine. main.cpp plays /audio/p01.wav + h1 + s1 once and then prints
# the audio state once a second.
#
# Build (roles/audio-unit.conf is owned by the LE Audio agent and must be
# passed too; conf files cannot include each other):
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp firmware -d firmware/build/audio-proof -- \
#     -DEXTRA_CONF_FILE="roles/audio-proof.conf;roles/audio-unit.conf"

CONFIG_PITCHCOMM_ROLE_AUDIO_PROOF=y
CONFIG_PITCHCOMM_CONSOLE=y
CONFIG_PITCHCOMM_AUDIO=y
CONFIG_PITCHCOMM_DISPLAY=n
CONFIG_PITCHCOMM_BATTERY=n
