# PitchComm coach: Thread FTD leader, USB console, no audio, no display.
#
# Build:
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp firmware -d firmware/build/coach -- \
#     -DEXTRA_CONF_FILE=roles/coach.conf
#
# This fragment is self-contained; the coach needs no field-common.conf.

CONFIG_PITCHCOMM_ROLE_COACH=y
CONFIG_PITCHCOMM_CONSOLE=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# VERIFY(kconfig): CONFIG_NET_SOCKETS_POSIX_NAMES does not exist in NCS v3.4.0
# (removed from subsys/net/lib/sockets/Kconfig); the firmware calls zsock_*
# directly, so no POSIX-name option is required here.
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_MAX_CHILDREN=4
CONFIG_OPENTHREAD_NUM_MESSAGE_BUFFERS=64
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=4096

# Volume persistence (and OpenThread network storage). SETTINGS_ZMS depends on
# ZMS and FLASH_MAP; the ZMS backend falls back to the board's storage_partition
# when no zephyr,settings-partition chosen node exists.
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS_ZMS=y
