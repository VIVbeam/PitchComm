# PitchComm firmware - baseline project config.
# Role-specific options live in roles/*.conf; board options in boards/.

CONFIG_CPP=y
CONFIG_STD_CPP17=y

# 1 ms kernel ticks: the call engine cadence is milliseconds.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Console over the XIAO debugger UART at 115200.
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
# VERIFY(console): console_getline() needs the optional CONSOLE_GETLINE choice;
# CONFIG_CONSOLE_SUBSYS alone leaves both getchar/getline unselected.
CONFIG_CONSOLE_GETLINE=y
CONFIG_SHELL=n

CONFIG_GPIO=y

# Factory device identity for the unprovisioned "eui" command.
# VERIFY(hwinfo): CONFIG_HWINFO=y selects CONFIG_HWINFO_NRF on the nRF54L15
# (hwinfo_nrf.c, NRF_FICR_HAS_INFO_DEVICE_ID path in NCS v3.4.0).
CONFIG_HWINFO=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
